<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340">
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- atom -->
    <g transform="translate(46,54) rotate(-12)">
      <circle cx="0" cy="0" r="3.4" fill="#ffffff" stroke="none"/>
      <ellipse cx="0" cy="0" rx="26" ry="11"/>
      <ellipse cx="0" cy="0" rx="26" ry="11" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="26" ry="11" transform="rotate(120)"/>
    </g>

    <!-- flask -->
    <g transform="translate(250,40) rotate(8)">
      <path d="M-8 -20 L8 -20 L8 -4 L20 22 A4 4 0 0 1 16 28 L-16 28 A4 4 0 0 1 -20 22 L-8 -4 Z"/>
      <path d="M-11 -20 L11 -20"/>
      <path d="M-9 8 L9 8"/>
    </g>

    <!-- DNA helix -->
    <g transform="translate(160,150)">
      <path d="M-18 -34 C 4 -22, -4 -10, 18 2 C 4 14, -4 22, -18 34"/>
      <path d="M18 -34 C -4 -22, 4 -10, -18 2 C -4 14, 4 22, 18 34"/>
      <path d="M-15 -26 L15 -26"/>
      <path d="M-13 -8 L13 -8"/>
      <path d="M-13 10 L13 10"/>
      <path d="M-15 26 L15 26"/>
    </g>

    <!-- microscope -->
    <g transform="translate(70,250) rotate(-6)">
      <path d="M0 26 h26"/>
      <path d="M13 26 V16"/>
      <circle cx="13" cy="4" r="10"/>
      <path d="M13 -6 L26 -18"/>
      <path d="M22 -22 L30 -14"/>
      <path d="M4 8 L10 14"/>
    </g>

    <!-- telescope / star -->
    <g transform="translate(272,236) rotate(10)">
      <circle cx="0" cy="0" r="9"/>
      <path d="M0 -16 V-22M0 16 V22M-16 0 H-22M16 0 H22"/>
      <path d="M-11 -11 L-15 -15M11 11 L15 15M-11 11 L-15 15M11 -11 L15 -15"/>
    </g>

    <!-- leaf -->
    <g transform="translate(155,290) rotate(20)">
      <path d="M0 20 C -18 14, -18 -10, 0 -20 C 18 -10, 18 14, 0 20 Z"/>
      <path d="M0 20 V-14"/>
    </g>

  </g>
</svg>
